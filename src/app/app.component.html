<!-- Notification for signalr -->
<!-- Start -->
<div style="text-align: center;" *ngIf="( signalRService.data!=undefined && signalRService.data.length!=0)">
  <p style="padding-left: 10px; margin: 0; color: red;font-weight: bold;" *ngFor="let notif of signalRService.data; let i = index;">
    <ng-container *ngIf="signalRService.data.length == 1">
      {{notif.message}}
    </ng-container>
    <ng-container *ngIf="signalRService.data.length > 1">
      {{notif.message}}<br>
    </ng-container>
  </p>
</div>
<!-- End -->
